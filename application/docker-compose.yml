# docker-compose.prod.yml — runs ONLY the Next.js application container.
# All other services (Postgres, Keycloak, RustFS/S3) are already running
# on the server and are reached via the env vars below.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f app
#   docker compose -f docker-compose.prod.yml down

